version: '3.8'

services:
  # ==========================================
  # 1. 关系型数据库 (MySQL 8.0)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: fitlog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fitlog_prod}
      MYSQL_USER: ${MYSQL_USER:-fitlog_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fitlog-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # 2. 缓存与分布式限流 (Redis 7.0)
  # ==========================================
  redis:
    image: redis:7.0-alpine
    container_name: fitlog-redis
    restart: always
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes;
        else
          redis-server --appendonly yes;
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - fitlog-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================================
  # 3. FitLog 后端服务 (Node.js API)
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fitlog-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required, e.g. mysql://user:pass@mysql:3306/fitlog_prod}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required, e.g. redis://:pass@redis:6379/0}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      VERIFICATION_STORE: ${VERIFICATION_STORE:-redis}
      RATE_LIMITER: ${RATE_LIMITER:-redis}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - ./data:/app/data:ro
    networks:
      - fitlog-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # 4. 反向代理与前端静态托管 (Nginx)
  # ==========================================
  nginx:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fitlog-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/fitlog.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - server
    networks:
      - fitlog-network

networks:
  fitlog-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  media_data:
